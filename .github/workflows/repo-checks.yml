name: Repository checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: repository-${{ github.ref }}
  cancel-in-progress: true
jobs:
  service-and-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install locked dependencies
        run: python -m pip install --require-hashes -r server/requirements.lock
      - name: Verify payment, authorization, scope, deadlines, refunds and recovery
        run: python -m unittest discover -s server -p 'test_*.py' -v
      - name: Verify repository and public contracts
        run: python scripts/check_repository.py
      - name: Check browser JavaScript syntax
        run: |
          node --check intake.js
          node --check status.js
          node --check sw.js
