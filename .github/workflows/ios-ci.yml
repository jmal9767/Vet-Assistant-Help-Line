name: iOS CI

on:
  pull_request:
    paths:
      - 'VetAssistantHelpLine/**'
      - 'VetAssistantHelpLineTests/**'
      - 'VetAssistantHelpLine.xcodeproj/**'
      - '.github/workflows/ios-ci.yml'
  push:
    branches:
      - main
    paths:
      - 'VetAssistantHelpLine/**'
      - 'VetAssistantHelpLineTests/**'
      - 'VetAssistantHelpLine.xcodeproj/**'
      - '.github/workflows/ios-ci.yml'

permissions:
  contents: read

concurrency:
  group: ios-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PROJECT: VetAssistantHelpLine.xcodeproj
  SCHEME: VetAssistantHelpLine

jobs:
  build-test-analyze:
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Verify Apple toolchain
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -version
          swiftc --version
          major=$(xcodebuild -version | awk '/Xcode/{split($2, version, "."); print version[1]}')
          if [[ -z "$major" || "$major" -lt 16 ]]; then
            echo "Xcode 16 or newer is required by this project."
            exit 1
          fi
          xcodebuild -list -project "$PROJECT"

      - name: Build without signing
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            clean build

      - name: Select an available iPhone simulator
        shell: bash
        run: |
          set -euo pipefail
          simulator_id=$(
            xcrun simctl list devices available --json | python3 -c '
          import json, re, sys

          devices = json.load(sys.stdin).get("devices", {})
          def runtime_version(identifier):
              match = re.search(r"iOS-(\d+)(?:-(\d+))?", identifier)
              return tuple(map(int, match.groups(default="0"))) if match else (0, 0)

          for runtime in sorted(devices, key=runtime_version, reverse=True):
              for device in devices[runtime]:
                  if device.get("isAvailable") and device.get("name", "").startswith("iPhone"):
                      print(device["udid"])
                      raise SystemExit(0)
          raise SystemExit("No available iPhone simulator found")
          '
          )
          echo "SIMULATOR_ID=$simulator_id" >> "$GITHUB_ENV"
          xcrun simctl boot "$simulator_id" 2>/dev/null || true
          xcrun simctl bootstatus "$simulator_id" -b

      - name: Run unit tests
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$SIMULATOR_ID" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            -resultBundlePath "$RUNNER_TEMP/VetAssistantHelpLineTests.xcresult" \
            CODE_SIGNING_ALLOWED=NO \
            test

      - name: Run static analyzer
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            analyze

      - name: Shut down simulator
        if: always() && env.SIMULATOR_ID != ''
        shell: bash
        run: xcrun simctl shutdown "$SIMULATOR_ID" 2>/dev/null || true
