name: Validate care line
on:
  push:
  pull_request:
jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: relay
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm run check
      - run: npm test
      - run: node ../scripts/build-site.mjs
  app:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: xcodebuild -project VetAssistantHelpLine.xcodeproj -scheme VetAssistantHelpLine -sdk iphonesimulator CODE_SIGNING_ALLOWED=NO build
