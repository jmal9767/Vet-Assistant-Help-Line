name: Repository checks

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: repo-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'

      - name: Require immutable action references
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          failures = []
          for workflow in Path(".github/workflows").glob("*.y*ml"):
              for line_number, line in enumerate(
                  workflow.read_text(encoding="utf-8").splitlines(),
                  start=1,
              ):
                  match = re.match(r"\s*uses:\s*([^\s#]+)", line)
                  if not match:
                      continue
                  reference = match.group(1)
                  if reference.startswith("./"):
                      continue
                  if not re.fullmatch(r"[^@\s]+@[0-9a-fA-F]{40}", reference):
                      failures.append(
                          f"{workflow}:{line_number}: action is not pinned to a full commit SHA: "
                          f"{reference}"
                      )

          if failures:
              raise SystemExit("\n".join(failures))
          PY

      - name: Reject unresolved shipping placeholders
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t violations < <(
            git grep -IlE \
              -e 'REPLACE_WITH_[A-Z0-9_]+' \
              -e 'PRODUCT_BUNDLE_IDENTIFIER = com\.example' \
              -- '*.swift' '*.html' '*.js' '*.pbxproj' || true
          )
          if (( ${#violations[@]} > 0 )); then
            echo "Unresolved shipping placeholders found in:"
            printf '  %s\n' "${violations[@]}"
            exit 1
          fi

      - name: Reject tracked credentials and private keys
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t secret_matches < <(
            git grep -IlE \
              -e '-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----' \
              -e 'sk-(proj|svcacct)-[A-Za-z0-9_-]{20,}' \
              -e 'AKIA[0-9A-Z]{16}' \
              -e 'gh[opsu]_[A-Za-z0-9]{36,}' \
              -e 'github_pat_[A-Za-z0-9_]{40,}' \
              -e 'sk_live_[A-Za-z0-9]{20,}' || true
          )
          if (( ${#secret_matches[@]} > 0 )); then
            echo "Potential credential material found in:"
            printf '  %s\n' "${secret_matches[@]}"
            exit 1
          fi

          mapfile -t sensitive_files < <(
            git ls-files | grep -E '(^|/)(\.env($|\.)|.*\.(p8|p12|pem|key|mobileprovision|provisionprofile)$|Secrets\.xcconfig$)' || true
          )
          if (( ${#sensitive_files[@]} > 0 )); then
            echo "Sensitive file types must not be tracked:"
            printf '  %s\n' "${sensitive_files[@]}"
            exit 1
          fi

      - name: Validate JSON-backed configuration
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' files < <(
            find . -type f \
              \( -name '*.json' -o -name '*.webmanifest' -o -name '*.storekit' \) \
              -not -path './.git/*' -print0
          )
          if (( ${#files[@]} == 0 )); then
            echo "No JSON-backed configuration files found."
            exit 1
          fi
          for file in "${files[@]}"; do
            jq empty "$file"
          done

          jq -e '
            (.products | length) == 1 and
            .products[0].type == "Consumable" and
            .products[0].productID == "com.bayareaapps.vetassistanthelpline.education_question" and
            .products[0].displayPrice == "9.99" and
            .products[0].referenceName == "One Education Question Email" and
            (.products[0].localizations | length) == 1 and
            .products[0].localizations[0].locale == "en_US" and
            .products[0].localizations[0].displayName == "One Education Question Email" and
            .products[0].localizations[0].description == "One nonmedical education question email."
          ' VetAssistantHelpLine/Configuration/VetAssistantHelpLine.storekit >/dev/null

          python3 - <<'PY'
          from pathlib import Path
          import plistlib

          manifest_path = Path("VetAssistantHelpLine/PrivacyInfo.xcprivacy")
          manifest = plistlib.loads(manifest_path.read_bytes())
          if manifest.get("NSPrivacyTracking") is not False:
              raise SystemExit("Privacy manifest must explicitly disable tracking")
          if manifest.get("NSPrivacyTrackingDomains", []) != []:
              raise SystemExit("Privacy manifest must contain no tracking domains")

          declarations = manifest.get("NSPrivacyAccessedAPITypes", [])
          if len(declarations) != 1:
              raise SystemExit("UserDefaults must be the only required-reason API declaration")
          user_defaults = [
              declaration for declaration in declarations
              if declaration.get("NSPrivacyAccessedAPIType")
              == "NSPrivacyAccessedAPICategoryUserDefaults"
          ]
          if len(user_defaults) != 1:
              raise SystemExit("Privacy manifest must declare UserDefaults exactly once")
          if user_defaults[0].get("NSPrivacyAccessedAPITypeReasons") != ["CA92.1"]:
              raise SystemExit("Privacy manifest must declare UserDefaults reason CA92.1")

          collected = manifest.get("NSPrivacyCollectedDataTypes", [])
          expected_types = {
              "NSPrivacyCollectedDataTypeName",
              "NSPrivacyCollectedDataTypeEmailAddress",
              "NSPrivacyCollectedDataTypeEmailsOrTextMessages",
              "NSPrivacyCollectedDataTypeOtherUserContent",
              "NSPrivacyCollectedDataTypePurchaseHistory",
          }
          actual_types = {
              item.get("NSPrivacyCollectedDataType") for item in collected
          }
          if len(collected) != len(expected_types):
              raise SystemExit("Privacy manifest data-type entries must be unique")
          if actual_types != expected_types:
              raise SystemExit(
                  f"Privacy manifest data types differ: {sorted(actual_types)}"
              )
          for item in collected:
              if item.get("NSPrivacyCollectedDataTypeLinked") is not True:
                  raise SystemExit("Collected data must be declared linked to the user")
              if item.get("NSPrivacyCollectedDataTypeTracking") is not False:
                  raise SystemExit("Collected data must be declared non-tracking")
              if item.get("NSPrivacyCollectedDataTypePurposes") != [
                  "NSPrivacyCollectedDataTypePurposeAppFunctionality"
              ]:
                  raise SystemExit("Collected data purpose must be App Functionality")
          PY

      - name: Validate HTML structure and local references
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from collections import Counter
          from html.parser import HTMLParser
          from pathlib import Path
          from urllib.parse import unquote, urlsplit
          import subprocess

          class Auditor(HTMLParser):
              def __init__(self, path):
                  super().__init__(convert_charrefs=True)
                  self.path = path
                  self.ids = []
                  self.labels = []
                  self.local_refs = []
                  self.errors = []

              def handle_starttag(self, tag, attrs):
                  values = dict(attrs)
                  if "id" in values:
                      self.ids.append(values["id"])
                  if tag == "label" and values.get("for"):
                      self.labels.append(values["for"])
                  if values.get("target") == "_blank":
                      rel = set((values.get("rel") or "").split())
                      if not {"noopener", "noreferrer"}.issubset(rel):
                          self.errors.append("target=_blank link is missing noopener noreferrer")
                  for attribute in ("href", "src"):
                      value = values.get(attribute)
                      if value:
                          self.local_refs.append(value)

              handle_startendtag = handle_starttag

          html_files = subprocess.check_output(
              ["git", "ls-files", "-z", "*.html"]
          ).decode().rstrip("\0").split("\0")
          failures = []
          for name in filter(None, html_files):
              path = Path(name)
              parser = Auditor(path)
              parser.feed(path.read_text(encoding="utf-8"))
              parser.close()
              if not parser.get_starttag_text():
                  failures.append(f"{name}: contains no HTML elements")
              duplicates = [key for key, count in Counter(parser.ids).items() if count > 1]
              if duplicates:
                  failures.append(f"{name}: duplicate ids: {', '.join(duplicates)}")
              missing_labels = sorted(set(parser.labels) - set(parser.ids))
              if missing_labels:
                  failures.append(f"{name}: label targets missing: {', '.join(missing_labels)}")
              failures.extend(f"{name}: {message}" for message in parser.errors)
              for reference in parser.local_refs:
                  parsed = urlsplit(reference)
                  if parsed.scheme or parsed.netloc or reference.startswith(("#", "tel:", "mailto:", "data:")):
                      continue
                  relative = unquote(parsed.path)
                  if not relative:
                      continue
                  target = Path(relative.lstrip("/")) if relative.startswith("/") else path.parent / relative
                  if not target.exists():
                      failures.append(f"{name}: missing local reference {reference}")

          if failures:
              raise SystemExit("\n".join(failures))
          print(f"Validated {len(html_files)} HTML files.")
          PY

      - name: Validate stylesheet structure
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          for path in Path(".").glob("*.css"):
              content = path.read_text(encoding="utf-8")
              depth = 0
              for position, character in enumerate(content, start=1):
                  if character == "{":
                      depth += 1
                  elif character == "}":
                      depth -= 1
                      if depth < 0:
                          raise SystemExit(
                              f"{path}: unexpected closing brace at character {position}"
                          )
              if depth:
                  raise SystemExit(f"{path}: {depth} unclosed rule block(s)")
          PY

      - name: Parse JavaScript
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r file; do
            [[ -n "$file" ]] && node --check "$file"
          done < <(git ls-files '*.js')
          node <<'JS'
          const fs = require("fs");
          const vm = require("vm");
          const { execFileSync } = require("child_process");

          const files = execFileSync("git", ["ls-files", "*.html"], { encoding: "utf8" })
            .split("\n")
            .filter(Boolean);
          for (const file of files) {
            const markup = fs.readFileSync(file, "utf8");
            const scripts = [...markup.matchAll(/<script(?:\s[^>]*)?>([\s\S]*?)<\/script>/gi)];
            scripts.forEach((match, index) => {
              new vm.Script(match[1], { filename: `${file}#inline-script-${index + 1}` });
            });
          }
          JS

      - name: Verify legacy PWA retirement
        shell: bash
        run: |
          set -euo pipefail
          if git grep -nE 'serviceWorker\.register' -- '*.html' '*.js'; then
            echo "The current website must not register a service worker."
            exit 1
          fi
          if [[ -f sw.js ]]; then
            grep -Fq 'name === "vahl-v1"' sw.js
            grep -Fq 'self.registration.unregister()' sw.js
          fi
          for obsolete in operator.html manifest.webmanifest icons/icon-180.png icons/icon-512.png docs/share-qr.png welcome.html; do
            if git ls-files --error-unmatch "$obsolete" >/dev/null 2>&1; then
              echo "Obsolete public artifact is still tracked: $obsolete"
              exit 1
            fi
          done

      - name: Validate app icon catalog
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json
          import struct

          catalog = Path("VetAssistantHelpLine/Assets.xcassets/AppIcon.appiconset")
          metadata = json.loads((catalog / "Contents.json").read_text(encoding="utf-8"))
          images = metadata.get("images", [])
          if not images:
              raise SystemExit("AppIcon catalog has no image definitions")

          for image in images:
              filename = image.get("filename")
              if not filename:
                  raise SystemExit("Every AppIcon definition must have a filename")
              path = catalog / filename
              if not path.is_file():
                  raise SystemExit(f"Missing AppIcon file: {path}")
              with path.open("rb") as stream:
                  header = stream.read(24)
              if header[:8] != b"\x89PNG\r\n\x1a\n":
                  raise SystemExit(f"AppIcon is not a PNG: {path}")
              width, height = struct.unpack(">II", header[16:24])
              if (width, height) != (1024, 1024):
                  raise SystemExit(f"AppIcon must be 1024x1024: {path} is {width}x{height}")
          PY

      - name: Verify release configuration contracts
        shell: bash
        run: |
          set -euo pipefail
          project='VetAssistantHelpLine.xcodeproj/project.pbxproj'
          grep -Fq 'PRODUCT_BUNDLE_IDENTIFIER = com.bayareaapps.vetassistanthelpline;' "$project"
          grep -Fq 'INFOPLIST_KEY_CFBundleDisplayName = "Veterinary Assistant Help Line";' "$project"
          [[ $(grep -Fc 'INFOPLIST_KEY_ITSAppUsesNonExemptEncryption = NO;' "$project") -eq 2 ]]
          grep -Fq 'MARKETING_VERSION = 1.0.0;' "$project"
          grep -Fq 'SWIFT_STRICT_CONCURRENCY = targeted;' "$project"
          grep -Fq 'com.apple.InAppPurchase = {' "$project"

          product_id=$(jq -r '.products[0].productID' VetAssistantHelpLine/Configuration/VetAssistantHelpLine.storekit)
          git grep -Fq "$product_id" -- '*.swift'

          test -f VetAssistantHelpLine.xcodeproj/xcshareddata/xcschemes/VetAssistantHelpLine.xcscheme
          test -n "$(find VetAssistantHelpLineTests -type f -name '*Tests.swift' -print -quit)"

      - name: Install operator dependencies in isolation
        shell: bash
        run: |
          set -euo pipefail
          operator_python="$RUNNER_TEMP/operator-venv/bin/python"
          python3 -m venv "$RUNNER_TEMP/operator-venv"
          "$operator_python" -c 'import sys; assert sys.version_info[:2] == (3, 12)'
          "$operator_python" -m pip install \
            --disable-pip-version-check \
            --require-hashes \
            --requirement operator/requirements.lock
          "$operator_python" -m pip check

      - name: Compile and test operator contracts
        shell: bash
        run: |
          set -euo pipefail
          operator_python="$RUNNER_TEMP/operator-venv/bin/python"
          mapfile -d '' python_files < <(
            find operator -maxdepth 1 -type f -name '*.py' -print0
          )
          if (( ${#python_files[@]} == 0 )); then
            echo "No operator Python files found."
            exit 1
          fi
          "$operator_python" -m py_compile "${python_files[@]}"
          "$operator_python" -m unittest discover \
            -s operator \
            -p 'test_*.py' \
            -v

      - name: Verify Xcode target and scheme graph
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from xml.etree import ElementTree as ET
          import re

          root = Path.cwd()
          project_path = root / "VetAssistantHelpLine.xcodeproj/project.pbxproj"
          project = project_path.read_text(encoding="utf-8")
          scheme_path = root / "VetAssistantHelpLine.xcodeproj/xcshareddata/xcschemes/VetAssistantHelpLine.xcscheme"
          scheme = ET.parse(scheme_path).getroot()

          definitions = set(re.findall(
              r"^\t\t([A-Z0-9]{24})(?: /\*.*?\*/)? = \{",
              project,
              re.MULTILINE,
          ))
          references = set(re.findall(r"\b([A-Z0-9]{24})\b", project))
          unresolved = sorted(references - definitions)
          if unresolved:
              raise SystemExit(f"Unresolved Xcode object identifiers: {unresolved}")

          app_target = "AB1234567890ABCDEF000006"
          test_target = "BAA000000000000000000006"
          dependency = "BAA00000000000000000000B"
          resource_exception = "BAA00000000000000000000C"
          for identifier in (app_target, test_target, dependency, resource_exception):
              if identifier not in definitions:
                  raise SystemExit(f"Missing expected Xcode object: {identifier}")

          dependency_pattern = (
              rf"{test_target} /\* VetAssistantHelpLineTests \*/ = \{{"
              rf".*?dependencies = \(\s*{dependency}"
          )
          if not re.search(dependency_pattern, project, re.DOTALL):
              raise SystemExit("Unit-test target does not depend on the app target")

          exclusion_pattern = (
              rf"{resource_exception} .*?membershipExceptions = \(\s*"
              rf"Configuration/VetAssistantHelpLine\.storekit,.*?target = {app_target}"
          )
          if not re.search(exclusion_pattern, project, re.DOTALL):
              raise SystemExit("Local StoreKit configuration must not ship in app resources")

          blueprint_ids = {
              node.attrib["BlueprintIdentifier"]
              for node in scheme.iter("BuildableReference")
          }
          if blueprint_ids != {app_target, test_target}:
              raise SystemExit(f"Unexpected scheme target graph: {sorted(blueprint_ids)}")

          testables = list(scheme.iter("TestableReference"))
          if len(testables) != 1 or (
              testables[0].find(".//BuildableReference").attrib["BlueprintIdentifier"]
              != test_target
          ):
              raise SystemExit("Shared scheme must directly test VetAssistantHelpLineTests")

          store_references = list(scheme.iter("StoreKitConfigurationFileReference"))
          if len(store_references) != 1:
              raise SystemExit("Shared scheme must select one local StoreKit configuration")
          store_path = (
              scheme_path.parent / store_references[0].attrib["identifier"]
          ).resolve()
          expected_store_path = (
              root / "VetAssistantHelpLine/Configuration/VetAssistantHelpLine.storekit"
          ).resolve()
          if store_path != expected_store_path or not store_path.is_file():
              raise SystemExit(f"StoreKit scheme reference does not resolve: {store_path}")

          if project.count("SDKROOT = iphoneos;") != 2:
              raise SystemExit("SDKROOT must be declared once per project configuration")
          PY

      - name: Check whitespace errors
        shell: bash
        run: git show --check --format= HEAD
